<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>शुभ दीपावली</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Yatra+One&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
      background-color: #030305;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
      font-family: 'Rozha One', serif;
      color: #fff;
      position: relative;
    }

    .stars {
      position: absolute; top: 0; left: 0; width: 100%; height: 70%;
      background: radial-gradient(circle at 50% 30%, rgba(255, 179, 71, 0.05), transparent 70%);
      pointer-events: none;
    }

    .message-container {
      margin-top: 8vh; text-align: center; z-index: 10; padding: 0 20px;
      max-width: 800px; min-height: 180px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }

    .main-title {
      font-size: 2.5rem; color: #ffcc00;
      text-shadow: 0 0 12px rgba(255, 179, 71, 0.8), 0 0 24px rgba(255, 120, 0, 0.5);
      letter-spacing: 2px; opacity: 0; transform: translateY(-15px);
      transition: opacity 1.2s ease, transform 1.2s ease;
    }

    .thought-text {
      font-size: 1.5rem; color: #fff6e5; margin-top: 15px; line-height: 1.6;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.4);
      opacity: 0; transform: scale(0.96);
      transition: opacity 1.5s ease 0.4s, transform 1.5s ease 0.4s;
    }

    .english-quote {
      font-family: Georgia, serif; font-size: 0.95rem; font-style: italic;
      color: rgba(255, 230, 180, 0.7); margin-top: 12px; opacity: 0;
      transition: opacity 1.5s ease 0.8s;
    }

    .visible { opacity: 1 !important; transform: translateY(0) scale(1) !important; }

    .stage {
      position: relative; width: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
      z-index: 5;
    }

    .center-building {
      position: relative; width: 320px; height: 160px;
      background: linear-gradient(to bottom, #11141c, #07090d);
      border-top: 4px solid #1f2535;
      display: flex; justify-content: center;
      box-shadow: 0 -5px 25px rgba(0, 0, 0, 0.8);
      z-index: 6;
    }

    .windows {
      position: absolute; top: 25px; display: grid;
      grid-template-columns: repeat(4, 25px); gap: 20px 35px;
    }

    .window {
      width: 25px; height: 35px; background: #151821; border-radius: 4px 4px 0 0;
      transition: background 1.5s ease, box-shadow 1.5s ease;
    }

    .window.lit { background: #ffd066; box-shadow: 0 0 15px rgba(255, 208, 102, 0.6); }

    /* दीया जलाएँ बटन */
    .light-btn {
      position: absolute;
      top: 78px;
      font-family: 'Yatra One', 'Rozha One', serif;
      font-size: 1.05rem;
      color: #3a0d01;
      background: linear-gradient(to bottom, #ffd066, #ff9a1f);
      border: none;
      border-radius: 30px;
      padding: 10px 26px;
      cursor: pointer;
      box-shadow: 0 0 16px rgba(255, 153, 0, 0.55), 0 3px 6px rgba(0, 0, 0, 0.6);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      z-index: 12;
      white-space: nowrap;
    }

    .light-btn:hover { transform: scale(1.06); box-shadow: 0 0 24px rgba(255, 153, 0, 0.85), 0 3px 6px rgba(0, 0, 0, 0.6); }
    .light-btn:active { transform: scale(0.97); }

    .skyline {
      position: absolute; bottom: 0; width: 100%; height: 130px;
      background: repeating-linear-gradient(90deg,
        #0b0d14 0px, #0b0d14 40px, #0e111a 40px, #0e111a 90px, #08090d 90px, #08090d 150px);
      clip-path: polygon(0% 40%, 15% 40%, 15% 20%, 28% 20%, 28% 50%,
        40% 50%, 60% 50%, 72% 50%, 72% 15%, 85% 15%,
        85% 35%, 100% 35%, 100% 100%, 0% 100%);
      z-index: 4; opacity: 0.6;
    }

    .diya-wrapper {
      position: absolute; top: -46px; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; z-index: 10;
    }

    .flame-glow {
      position: absolute; top: -50px; width: 150px; height: 150px;
      background: radial-gradient(circle, rgba(255, 140, 0, 0.45) 0%, rgba(255, 69, 0, 0.15) 50%, transparent 70%);
      border-radius: 50%; opacity: 0; transform: scale(0.3);
      transition: opacity 0.8s ease, transform 0.8s ease;
      pointer-events: none; z-index: 1;
    }

    .glow-active {
      opacity: 1 !important; transform: scale(1) !important;
      animation: pulseGlow 2.5s infinite alternate ease-in-out;
    }

    .flame {
      width: 20px; height: 42px;
      background: radial-gradient(ellipse at bottom, #ffffff 12%, #ffe066 38%, #ff6600 75%, transparent 100%);
      border-radius: 50% 50% 20% 20% / 60% 60% 40% 40%;
      position: relative; margin-bottom: -10px; z-index: 2;
      opacity: 0; transform: scale(0.2) translateY(20px); transform-origin: bottom center;
      transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.18, 0.89, 0.32, 1.28);
      filter: drop-shadow(0 0 10px #ff9900);
    }

    .flame-burning {
      opacity: 1 !important; transform: scale(1) translateY(0) !important;
      animation: flicker 0.12s infinite alternate ease-in-out;
    }

    @keyframes flicker {
      0% { transform: rotate(-1.5deg) scaleX(0.96) scaleY(1.02); }
      100% { transform: rotate(1.5deg) scaleX(1.04) scaleY(0.98); }
    }

    @keyframes pulseGlow {
      0% { transform: scale(0.95); opacity: 0.7; }
      100% { transform: scale(1.15); opacity: 1; }
    }

    .diya-svg { position: relative; z-index: 3; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.8)); }

    .hint {
      position: absolute; bottom: 15px; font-size: 0.9rem; color: #7b8294;
      letter-spacing: 1px; animation: floatHint 2s infinite ease-in-out;
    }

    @keyframes floatHint {
      0%, 100% { opacity: 0.4; transform: translateY(0); }
      50% { opacity: 0.9; transform: translateY(-4px); }
    }

    @media (max-width: 480px) {
      .main-title { font-size: 1.8rem; }
      .thought-text { font-size: 1.15rem; }
    }
  </style>
</head>
<body>
  <div class="stars"></div>

  <div class="message-container">
    <h1 id="title" class="main-title">दीपावली की हार्दिक शुभकामनाएँ</h1>
    <p id="thought" class="thought-text"></p>
    <p id="englishQuote" class="english-quote">“May your life always find its light.”</p>
  </div>

  <div class="stage">
    <div class="diya-wrapper" id="diyaBtn">
      <div class="flame-glow" id="glow"></div>
      <div class="flame" id="flame"></div>

      <svg class="diya-svg" viewBox="0 0 120 45" width="110" height="42">
        <defs>
          <linearGradient id="clayGradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#b8531d" />
            <stop offset="60%" stop-color="#802805" />
            <stop offset="100%" stop-color="#4a1402" />
          </linearGradient>
          <linearGradient id="rimGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#5a1800" />
            <stop offset="50%" stop-color="#e07134" />
            <stop offset="100%" stop-color="#5a1800" />
          </linearGradient>
        </defs>
        <path d="M 10,12 Q 60,52 110,12 Q 95,3 60,3 Q 25,3 10,12 Z" fill="url(#clayGradient)" />
        <ellipse cx="60" cy="11" rx="48" ry="7" fill="url(#rimGradient)" />
        <ellipse cx="60" cy="12" rx="38" ry="4" fill="#3a0d01" />
      </svg>
    </div>

    <div class="center-building">
      <div class="windows">
        <div class="window"></div>
        <div class="window"></div>
        <div class="window"></div>
        <div class="window"></div>
      </div>
      <button class="light-btn" id="lightBtn" type="button">🪔 दीया जलाएँ</button>
    </div>

    <div class="skyline"></div>
  </div>

  <div class="hint" id="hintText">दीपक प्रज्वलित करने के लिए स्पर्श करें</div>

  <script>
    const thoughts = [
      "यह पावन प्रकाश आपके अंतर्मन के अज्ञान और तमस को हर कर ज्ञान का आलोक फैलाए।",
      "सत्य और धर्म की ज्योति आपके जीवन के प्रत्येक पथ को सदा आलोकित करती रहे।",
      "दीपक की यह दिव्य लौ आपके परिवार में सुख, शांति और अक्षय समृद्धि का संचार करे।",
      "तमसो मा ज्योतिर्गमय — आपका जीवन सदैव अंधकार से प्रकाश और सकारात्मकता की ओर बढ़े।",
      "आत्म-संयम और प्रेम का यह पावन दीप आपके हृदय को नवीन आशा और ऊर्जा से भर दे।",
      "जैसे यह दीपक छत की ऊँचाई से जगमगा रहा है, वैसे ही आपका यश और कीर्ति सर्वत्र फैले।"
    ];

    let currentIndex = 0;
    const diyaBtn = document.getElementById('diyaBtn');
    const lightBtn = document.getElementById('lightBtn');
    const flame = document.getElementById('flame');
    const glow = document.getElementById('glow');
    const title = document.getElementById('title');
    const thought = document.getElementById('thought');
    const englishQuote = document.getElementById('englishQuote');
    const hintText = document.getElementById('hintText');
    const windows = document.querySelectorAll('.window');

    function lightDiya() {
      flame.classList.add('flame-burning');
      glow.classList.add('glow-active');
      windows.forEach(w => w.classList.add('lit'));

      thought.classList.remove('visible');
      title.classList.remove('visible');
      englishQuote.classList.remove('visible');

      setTimeout(() => {
        thought.textContent = thoughts[currentIndex];
        currentIndex = (currentIndex + 1) % thoughts.length;
        title.classList.add('visible');
        thought.classList.add('visible');
        englishQuote.classList.add('visible');
      }, 300);

      hintText.textContent = "पुनः विचार बदलने के लिए दीप को स्पर्श करें";
      lightBtn.textContent = "🪔 नया संदेश देखें";
    }

    diyaBtn.addEventListener('click', lightDiya);
    lightBtn.addEventListener('click', lightDiya);
  </script>
</body>
  </html>
